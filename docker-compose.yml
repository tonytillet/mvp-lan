version: '3.8'

services:
  backend:
    build: .
    container_name: lan-lol-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lan-lol-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  service-account-key:
